name: libjxlz CI

on:
  push:
    branches:
      - yolo
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
            name: linux-x86_64
            timeout: 30
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
            name: linux-aarch64
            timeout: 30
          - runner: macos-latest
            system: aarch64-darwin
            name: macos-aarch64
            timeout: 45

    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.name }}
    timeout-minutes: ${{ matrix.timeout }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # actions/checkout does not fetch submodules, and two suites need them:
      # the ground-truth decode corpus lives in the upstream libjxl `testdata`
      # submodule (without it djxl reports "couldn't load ..." and 7 oracle
      # suites fail), and capi_compressed_icc_cross_oracle.sh configures an
      # upstream CMake build that requires highway ("Could NOT find HWY") plus
      # its sibling third_party checkouts. Initialising all top-level submodules
      # is ~144 MB and costs about a minute; picking them one at a time costs an
      # 8-minute CI round trip per missing dependency. Non-recursive on purpose:
      # nested submodules are not consumed.
      - name: Fetch submodules
        run: git submodule update --init

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build package
        run: nix build .#packages.${{ matrix.system }}.default -L

      - name: Run flake test check
        # Targets exactly checks.<system>.test so the windows-cross check
        # (which is only relevant on x86_64-linux and exercises a separate
        # mingw cross-build toolchain) does not gate the primary CI matrix.
        run: nix build .#checks.${{ matrix.system }}.test -L

      - name: Run full test suite
        run: nix develop -c ./test
